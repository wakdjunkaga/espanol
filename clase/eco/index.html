<!doctype html><html lang='es'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='robots' content='noindex,nofollow'><title>Eco</title><link rel='preconnect' href='https://fonts.googleapis.com'><link rel='preconnect' href='https://fonts.gstatic.com' crossorigin><link rel='stylesheet' href='https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,600&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Noto+Serif+SC:wght@400;500;700&amp;family=Noto+Sans+SC:wght@400;500&amp;display=swap'><style>:root{
  --paper:#e9e7e1;--card:#f4f3ef;--ink:#1a1916;--ink2:#43413b;--muted:#78756c;
  --rule:#cfcbc1;--rule-soft:#dcd8ce;
  --red:#bb392a;--blue:#2b5378;--blue-rgb:43,83,120;
  --tint-rgb:34,94,156;--tint-a:.175;--tint-b:.07;
  --graph:#6e6f72;--graph-rgb:110,111,114;
  --deep:#20303a;--deep-ink:#ebe8e1;--deep-dim:#93a1a8;--deep-rule:#3b4c57;
  --deep-red:#e07a63;
  --now:#20303a;--now-ink:#ebe8e1;
  --hl:#d9b45e;--hl-ink:#1a1916;

  --rhythm:30rem;      /* max width of a measure — an instrument, not a console */
  --measure:47rem;     /* the page column */
  --reading:19px;      /* reader pages override this from localStorage */
  --read:"Source Serif 4",Georgia,serif;
  --app:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --hans:"Noto Serif SC","Songti SC",STSong,SimSun,serif;
  --hanx:"Noto Sans SC","PingFang SC","Hiragino Sans GB",sans-serif;

  --es-bg:var(--paper);        --es-card:var(--card);
  --es-panel:var(--card);      --es-instrument:var(--card);
  --es-ink:var(--ink);         --es-soft:var(--ink2);
  --es-muted:var(--muted);     --es-rule:var(--rule);
  --es-gold:var(--hl);         --es-accent:var(--blue);
  --es-deep:var(--deep);       --es-rec:var(--deep);
  --es-go:var(--blue);         --es-measure:var(--measure);
  --es-serif:var(--read);      --es-han:var(--hans);
  --es-sans:var(--hanx);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#16161a;--card:#1e1e24;--ink:#e8e6e0;--ink2:#c2bfb7;--muted:#8b887f;
  --rule:#33333c;--rule-soft:#282830;
  --red:#e77a67;--blue:#87afd6;--blue-rgb:135,175,214;
  --tint-rgb:120,168,214;--tint-a:.20;--tint-b:.085;
  --graph:#9b9ca0;--graph-rgb:155,156,160;
  --deep:#242b33;--deep-ink:#e8e6e0;--deep-dim:#98a4ac;--deep-rule:#3a444d;
  --deep-red:#e77a67;
  --now:#cfd4d9;--now-ink:#14181c;
  --hl:#d9b45e;--hl-ink:#14181c;
}}
:root[data-theme="dark"]{
  --paper:#16161a;--card:#1e1e24;--ink:#e8e6e0;--ink2:#c2bfb7;--muted:#8b887f;
  --rule:#33333c;--rule-soft:#282830;
  --red:#e77a67;--blue:#87afd6;--blue-rgb:135,175,214;
  --tint-rgb:120,168,214;--tint-a:.20;--tint-b:.085;
  --graph:#9b9ca0;--graph-rgb:155,156,160;
  --deep:#242b33;--deep-ink:#e8e6e0;--deep-dim:#98a4ac;--deep-rule:#3a444d;
  --deep-red:#e77a67;
  --now:#cfd4d9;--now-ink:#14181c;
  --hl:#d9b45e;--hl-ink:#14181c;
}

*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--read);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  -webkit-tap-highlight-color:transparent;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 auto 14px;max-width:60rem;width:100%}
nav[hidden]{display:none}
nav button{font:500 15px var(--app);background:none;border:1px solid var(--rule);color:var(--ink2);
  padding:8px 14px;border-radius:999px;cursor:pointer}
nav button.sel{background:var(--ink);color:var(--paper);border-color:var(--ink)}
main{flex:1;width:100%;max-width:60rem;margin:0 auto;display:grid;gap:14px;align-content:start;
  grid-template-columns:repeat(auto-fill,minmax(min(100%,17rem),1fr))}
.f{position:relative;min-height:7.5rem;padding:22px 18px 30px;border:1px solid var(--rule);border-radius:18px;
  background:var(--card);color:var(--ink);font:600 calc(var(--fs)*1px)/1.2 var(--read);text-align:center;
  cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;
  transition:transform .08s,background .15s}
.f:active{transform:scale(.97)}
.f.on{background:var(--hl);color:var(--hl-ink);border-color:var(--hl)}
.dots{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:6px}
.dots i{width:7px;height:7px;border-radius:50%;border:1.5px solid currentColor;opacity:.45}
.dots i.cur{background:currentColor;opacity:.8}
footer{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:18px;
  font:400 14px var(--app);color:var(--muted)}
footer button{font:500 14px var(--app);background:none;border:1px solid var(--rule);color:var(--ink2);
  min-width:44px;height:36px;padding:0 10px;border-radius:8px;cursor:pointer}
footer button.sel{border-color:var(--ink2);color:var(--ink)}
footer .gap{width:14px}
</style></head><body><nav></nav><main></main><footer><button data-fs='-' aria-label='Texto más pequeño'>A−</button><button data-fs='+' aria-label='Texto más grande'>A+</button><span class='gap'></span><button data-rate='0.8'>0,8×</button><button data-rate='1'>1×</button></footer><script>
const DATA = [{"nombre": "Quiero", "frases": [{"texto": "Quiero comer ahora", "audios": ["audio/quiero-comer-ahora-1.mp3"]}, {"texto": "¿Quieres tomar algo?", "audios": ["audio/quieres-tomar-algo-1.mp3"]}, {"texto": "No puedo", "audios": ["audio/no-puedo-1.mp3", "audio/no-puedo-2.mp3"]}]}];
const store = {get(k,d){try{const v=localStorage.getItem('eco.'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
               set(k,v){try{localStorage.setItem('eco.'+k,JSON.stringify(v))}catch(e){}}};
let screen = Math.min(store.get('screen',0), DATA.length-1);
let fs = store.get('fs',30), rate = store.get('rate',1);
const players = {};            // url -> Audio, created once and reused
let playing = null;             // {audio, btn}
const nextTake = {};            // "screen/index" -> which take plays next

function audioFor(url){ if(!players[url]){ const a=new Audio(url); a.preload='auto'; players[url]=a; } return players[url]; }
function stop(){ if(!playing) return; playing.audio.pause(); playing.btn.classList.remove('on'); playing=null; }

function tap(si, fi, btn){
  const f = DATA[si].frases[fi], key = si+'/'+fi;
  const take = (nextTake[key]||0) % f.audios.length;
  nextTake[key] = take+1;
  stop();
  const a = audioFor(f.audios[take]);
  a.currentTime = 0; a.playbackRate = rate;
  btn.classList.add('on');
  btn.querySelectorAll('.dots i').forEach((d,i)=>d.classList.toggle('cur', i===take));
  playing = {audio:a, btn};
  a.onended = () => { if(playing && playing.audio===a) stop(); };
  a.play().catch(()=>stop());
}

function render(){
  document.documentElement.style.setProperty('--fs', fs);
  const nav = document.querySelector('nav');
  nav.hidden = DATA.length < 2;
  nav.innerHTML = '';
  DATA.forEach((s,i)=>{ const b=document.createElement('button'); b.textContent=s.nombre;
    b.className = i===screen?'sel':''; b.onclick=()=>{stop(); screen=i; store.set('screen',i); render();}; nav.appendChild(b); });
  const main = document.querySelector('main'); main.innerHTML = '';
  DATA[screen].frases.forEach((f,fi)=>{
    const b = document.createElement('button'); b.className='f'; b.textContent=f.texto;
    if(f.audios.length>1){ const d=document.createElement('span'); d.className='dots';
      f.audios.forEach(()=>d.appendChild(document.createElement('i'))); b.appendChild(d); }
    b.addEventListener('click', ()=>tap(screen, fi, b));
    main.appendChild(b);
    f.audios.forEach(audioFor);   // warm up this screen's audio
  });
  document.querySelectorAll('[data-rate]').forEach(b=>b.classList.toggle('sel', +b.dataset.rate===rate));
}
document.querySelector('[data-fs="-"]').onclick=()=>{fs=Math.max(18,fs-4);store.set('fs',fs);render();};
document.querySelector('[data-fs="+"]').onclick=()=>{fs=Math.min(64,fs+4);store.set('fs',fs);render();};
document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{rate=+b.dataset.rate;store.set('rate',rate);
  if(playing) playing.audio.playbackRate=rate; render();});
render();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');
</script></body></html>
