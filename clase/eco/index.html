<!doctype html><html lang='es'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='robots' content='noindex,nofollow'><title>Eco</title><link rel='preconnect' href='https://fonts.googleapis.com'><link rel='preconnect' href='https://fonts.gstatic.com' crossorigin><link rel='stylesheet' href='https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,600&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Noto+Serif+SC:wght@400;500;700&amp;family=Noto+Sans+SC:wght@400;500&amp;display=swap'><style>:root{
  --paper:#e9e7e1;--card:#f4f3ef;--ink:#1a1916;--ink2:#43413b;--muted:#78756c;
  --rule:#cfcbc1;--rule-soft:#dcd8ce;
  --red:#bb392a;--blue:#2b5378;--blue-rgb:43,83,120;
  --tint-rgb:34,94,156;--tint-a:.175;--tint-b:.07;
  --graph:#6e6f72;--graph-rgb:110,111,114;
  --deep:#20303a;--deep-ink:#ebe8e1;--deep-dim:#93a1a8;--deep-rule:#3b4c57;
  --deep-red:#e07a63;
  --now:#20303a;--now-ink:#ebe8e1;
  --hl:#d9b45e;--hl-ink:#1a1916;

  --rhythm:30rem;      /* max width of a measure — an instrument, not a console */
  --measure:47rem;     /* the page column */
  --reading:19px;      /* reader pages override this from localStorage */
  --read:"Source Serif 4",Georgia,serif;
  --app:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --hans:"Noto Serif SC","Songti SC",STSong,SimSun,serif;
  --hanx:"Noto Sans SC","PingFang SC","Hiragino Sans GB",sans-serif;

  --es-bg:var(--paper);        --es-card:var(--card);
  --es-panel:var(--card);      --es-instrument:var(--card);
  --es-ink:var(--ink);         --es-soft:var(--ink2);
  --es-muted:var(--muted);     --es-rule:var(--rule);
  --es-gold:var(--hl);         --es-accent:var(--blue);
  --es-deep:var(--deep);       --es-rec:var(--deep);
  --es-go:var(--blue);         --es-measure:var(--measure);
  --es-serif:var(--read);      --es-han:var(--hans);
  --es-sans:var(--hanx);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#16161a;--card:#1e1e24;--ink:#e8e6e0;--ink2:#c2bfb7;--muted:#8b887f;
  --rule:#33333c;--rule-soft:#282830;
  --red:#e77a67;--blue:#87afd6;--blue-rgb:135,175,214;
  --tint-rgb:120,168,214;--tint-a:.20;--tint-b:.085;
  --graph:#9b9ca0;--graph-rgb:155,156,160;
  --deep:#242b33;--deep-ink:#e8e6e0;--deep-dim:#98a4ac;--deep-rule:#3a444d;
  --deep-red:#e77a67;
  --now:#cfd4d9;--now-ink:#14181c;
  --hl:#d9b45e;--hl-ink:#14181c;
}}
:root[data-theme="dark"]{
  --paper:#16161a;--card:#1e1e24;--ink:#e8e6e0;--ink2:#c2bfb7;--muted:#8b887f;
  --rule:#33333c;--rule-soft:#282830;
  --red:#e77a67;--blue:#87afd6;--blue-rgb:135,175,214;
  --tint-rgb:120,168,214;--tint-a:.20;--tint-b:.085;
  --graph:#9b9ca0;--graph-rgb:155,156,160;
  --deep:#242b33;--deep-ink:#e8e6e0;--deep-dim:#98a4ac;--deep-rule:#3a444d;
  --deep-red:#e77a67;
  --now:#cfd4d9;--now-ink:#14181c;
  --hl:#d9b45e;--hl-ink:#14181c;
}

*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--read);min-height:100vh;min-height:100dvh;
  -webkit-tap-highlight-color:transparent;padding:12px 12px calc(16px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.wrap{max-width:60rem;margin:0 auto}
header{display:flex;gap:6px;align-items:center;margin-bottom:12px}
.boards{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none}
.boards::-webkit-scrollbar{display:none}
.chip{font:500 13px var(--app);background:none;border:1px solid var(--rule);color:var(--ink2);
  padding:6px 12px;border-radius:999px;white-space:nowrap}
.chip.sel{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tool{font:500 13px var(--app);background:none;border:1px solid var(--rule);color:var(--ink2);
  padding:6px 10px;border-radius:8px;white-space:nowrap}
main{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(6.5rem,1fr))}
.f{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;overflow:hidden;
  overflow-wrap:anywhere;hyphens:auto;padding:8px 8px 14px;border:1px solid var(--rule);border-radius:12px;
  background:var(--card);font:600 calc(var(--fs)*1px)/1.2 var(--read);text-align:center;
  user-select:none;-webkit-user-select:none;transition:transform .08s,background .15s}
.f:active{transform:scale(.96)}
.f.on{background:var(--hl);color:var(--hl-ink);border-color:var(--hl)}
.dots{position:absolute;left:0;right:0;bottom:6px;display:flex;justify-content:center;gap:4px}
.dots i{width:5px;height:5px;border-radius:50%;border:1px solid currentColor;opacity:.45}
.dots i.cur{background:currentColor;opacity:.8}
.empty{grid-column:1/-1;color:var(--muted);font:400 14px var(--app);text-align:center;padding:30px 0}

/* organizer */
#org{position:fixed;inset:0;background:var(--paper);overflow-y:auto;
  padding:12px 12px calc(24px + env(safe-area-inset-bottom))}
#org[hidden]{display:none}
#org h2{font:500 12px var(--app);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
#org .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#org ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule-soft)}
#org li{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--rule-soft);
  font:600 16px/1.25 var(--read)}
#org li span{flex:1}
#org li button{font:500 15px var(--app);background:none;border:1px solid var(--rule);color:var(--ink2);
  width:36px;height:34px;border-radius:8px;padding:0}
#org li button:disabled{opacity:.3}
#org li button.add{color:var(--blue);border-color:var(--blue)}
#org li.on span{color:var(--hl-ink);background:var(--hl);border-radius:4px;padding:0 4px;flex:0 1 auto;margin-right:auto}
#org .none{color:var(--muted);font:400 13px var(--app);padding:10px 0;border-bottom:1px solid var(--rule-soft)}
#org .top{display:flex;justify-content:space-between;align-items:center}
#org .top b{font:600 18px var(--read)}
#org .done{font:500 14px var(--app);background:var(--ink);color:var(--paper);border:0;padding:8px 16px;border-radius:8px}
</style></head><body><div class='wrap'>
<header><div class='boards'></div><button class='tool' id='open'>Organizar</button></header>
<main></main>
</div>
<div id='org' hidden><div class='wrap'>
  <div class='top'><b>Organizar</b><button class='done' id='close'>Listo</button></div>
  <h2>Tableros</h2>
  <div class='row' id='oboards'></div>
  <div class='row' style='margin-top:8px'>
    <button class='tool' id='new'>+ Nuevo</button><button class='tool' id='ren'>Renombrar</button>
    <button class='tool' id='del'>Borrar</button>
  </div>
  <h2 id='inhead'>En este tablero</h2><ul id='inlist'></ul>
  <h2>Biblioteca</h2><ul id='outlist'></ul>
  <h2>Tamaño del texto</h2>
  <div class='row'><button class='tool' id='fsm'>A−</button><button class='tool' id='fsp'>A+</button></div>
</div></div><script>
const LIB = {"quiero-comer-ahora": {"texto": "Quiero comer ahora", "audios": ["audio/quiero-comer-ahora-1-5a8c27.mp3"]}, "quieres-tomar-algo": {"texto": "¿Quieres tomar algo?", "audios": ["audio/quieres-tomar-algo-1-1ec792.mp3"]}, "no-puedo": {"texto": "No puedo", "audios": ["audio/no-puedo-1-7deb18.mp3", "audio/no-puedo-2-91caff.mp3"]}, "quieres-tomar-algo-conmigo": {"texto": "¿Quieres tomar algo conmigo?", "audios": ["audio/quieres-tomar-algo-conmigo-1-d74a49.mp3", "audio/quieres-tomar-algo-conmigo-2-9b5428.mp3"]}, "que-quieres": {"texto": "¿Qué quieres?", "audios": ["audio/que-quieres-1-0a7e62.mp3", "audio/que-quieres-2-7825ae.mp3"]}, "no-tengo-tiempo": {"texto": "No tengo tiempo", "audios": ["audio/no-tengo-tiempo-1-cd93b9.mp3"]}, "no-tengo-dinero": {"texto": "No tengo dinero", "audios": ["audio/no-tengo-dinero-1-1339c0.mp3", "audio/no-tengo-dinero-2-249994.mp3"]}, "tienes-que-ir": {"texto": "¡Tienes que ir!", "audios": ["audio/tienes-que-ir-1-627f64.mp3", "audio/tienes-que-ir-2-a7a287.mp3"]}, "quien-quiere-pizza": {"texto": "¿Quién quiere pizza?", "audios": ["audio/quien-quiere-pizza-1-fa4ac8.mp3", "audio/quien-quiere-pizza-2-47ba1b.mp3"]}, "hoy-no-quiero-trabajar": {"texto": "Hoy no quiero trabajar", "audios": ["audio/hoy-no-quiero-trabajar-1-75ebcd.mp3", "audio/hoy-no-quiero-trabajar-2-0e5269.mp3"]}, "no-puede-esperarme": {"texto": "No puede esperarme", "audios": ["audio/no-puede-esperarme-1-c4c011.mp3", "audio/no-puede-esperarme-2-f511a2.mp3"]}};            // id -> {texto, audios}
const DEFAULT_BOARDS = [{"nombre": "Quiero", "ids": ["quiero-comer-ahora", "quieres-tomar-algo", "no-puedo", "quieres-tomar-algo-conmigo", "que-quieres", "no-tengo-tiempo", "no-tengo-dinero", "tienes-que-ir", "quien-quiere-pizza", "hoy-no-quiero-trabajar", "no-puede-esperarme"]}];
const ORDER = Object.keys(LIB);
const store = {get(k,d){try{const v=localStorage.getItem('eco.'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
               set(k,v){try{localStorage.setItem('eco.'+k,JSON.stringify(v))}catch(e){}}};
let boards = store.get('boards', null);
// Boards and sentences added to frases.json later reach a phone that already
// has its own boards. Each default board, and each sentence on it, is offered
// once: whatever was deleted on the phone stays gone.
{ const had = !!boards; if(!boards) boards = [];
  const seenB = store.get('seen', null) || (had ? ['Quiero'] : []);
  const seenI = store.get('seenItems', null) ||
    (had ? ['quiero-comer-ahora','quieres-tomar-algo','no-puedo'].map(id=>'Quiero|'+id) : []);
  // one-off: the short-lived "Nuevas" board (12 Nov) folded into "Quiero"
  boards = boards.filter(b => !(b.nombre==='Nuevas' && b.ids.join()==='quieres-tomar-algo-conmigo,que-quieres,no-tengo-tiempo,no-tengo-dinero,tienes-que-ir'));
  DEFAULT_BOARDS.forEach(d=>{
    let b = boards.find(x=>x.nombre===d.nombre);
    if(!b){ if(seenB.includes(d.nombre)) return; b = {nombre:d.nombre, ids:[]}; boards.push(b); }
    if(!seenB.includes(d.nombre)) seenB.push(d.nombre);
    d.ids.forEach(id=>{ const k=d.nombre+'|'+id; if(seenI.includes(k)) return; if(!b.ids.includes(id)) b.ids.push(id); seenI.push(k); });
  });
  store.set('seen', seenB); store.set('seenItems', seenI); store.set('boards', boards); }
let cur = Math.min(store.get('cur',0), boards.length-1);
let fs = store.get('fs2',15);
const save = () => { store.set('boards', boards); store.set('cur', cur); };
const $ = s => document.querySelector(s);

const players = {}; let playing = null; const nextTake = {};
function audioFor(url){ if(!players[url]){ const a=new Audio(url); a.preload='auto'; players[url]=a; } return players[url]; }
function stop(){ if(!playing) return; playing.audio.pause(); playing.el.classList.remove('on'); playing=null; }
function play(id, el){
  const f = LIB[id]; if(!f) return;
  const take = (nextTake[id]||0) % f.audios.length; nextTake[id] = take+1;
  stop();
  const a = audioFor(f.audios[take]); a.currentTime = 0;
  el.classList.add('on');
  el.querySelectorAll('.dots i').forEach((d,i)=>d.classList.toggle('cur', i===take));
  playing = {audio:a, el};
  a.onended = () => { if(playing && playing.audio===a) stop(); };
  a.play().catch(()=>stop());
}
const ids = b => b.ids.filter(id => LIB[id]);

function chip(text, sel, onclick){ const b=document.createElement('button'); b.className='chip'+(sel?' sel':''); b.textContent=text; b.onclick=onclick; return b; }

function renderMain(){
  document.documentElement.style.setProperty('--fs', fs);
  const bar = $('.boards'); bar.innerHTML='';
  if(boards.length>1) boards.forEach((b,i)=>bar.appendChild(chip(b.nombre, i===cur, ()=>{stop(); cur=i; save(); renderMain();})));
  const main = $('main'); main.innerHTML='';
  const list = boards.length ? ids(boards[cur]) : [];
  if(!list.length){ const p=document.createElement('p'); p.className='empty'; p.textContent='Tablero vacío — toca «Organizar».'; main.appendChild(p); }
  list.forEach(id=>{
    const f = LIB[id], b = document.createElement('button'); b.className='f'; b.textContent=f.texto;
    if(f.audios.length>1){ const d=document.createElement('span'); d.className='dots'; f.audios.forEach(()=>d.appendChild(document.createElement('i'))); b.appendChild(d); }
    b.addEventListener('click', ()=>play(id, b));
    main.appendChild(b); f.audios.forEach(audioFor);
  });
}

function btn(label, title, fn, cls){ const b=document.createElement('button'); b.textContent=label; b.title=title; if(cls) b.className=cls; b.onclick=fn; return b; }
function li(id, buttons){
  const l=document.createElement('li'), s=document.createElement('span'); s.textContent=LIB[id].texto;
  s.onclick=()=>play(id, l); l.appendChild(s); buttons.forEach(x=>l.appendChild(x)); return l;
}
function renderOrg(){
  const ob=$('#oboards'); ob.innerHTML='';
  boards.forEach((b,i)=>ob.appendChild(chip(b.nombre, i===cur, ()=>{stop(); cur=i; save(); renderOrg();})));
  const has = boards.length>0; $('#ren').disabled=!has; $('#del').disabled=!has;
  const inl=$('#inlist'), outl=$('#outlist'); inl.innerHTML=''; outl.innerHTML='';
  $('#inhead').textContent = has ? 'En «'+boards[cur].nombre+'»' : 'En este tablero';
  const on = has ? ids(boards[cur]) : [];
  on.forEach((id,i)=>{
    const move=(d)=>()=>{ const a=boards[cur].ids, j=a.indexOf(id), k=a.indexOf(on[i+d]); [a[j],a[k]]=[a[k],a[j]]; save(); renderOrg(); };
    const up=btn('↑','Subir',move(-1)), dn=btn('↓','Bajar',move(1)); up.disabled=i===0; dn.disabled=i===on.length-1;
    inl.appendChild(li(id,[up,dn,btn('✕','Quitar',()=>{ boards[cur].ids=boards[cur].ids.filter(x=>x!==id); save(); renderOrg(); })]));
  });
  if(!on.length){ const p=document.createElement('div'); p.className='none'; p.textContent= has?'Nada todavía. Añade frases desde la biblioteca.':'Crea un tablero primero.'; inl.appendChild(p); }
  const off = ORDER.filter(id=>!on.includes(id));
  off.forEach(id=>{ const add=btn('+','Añadir',()=>{ boards[cur].ids.push(id); save(); renderOrg(); },'add'); add.disabled=!has; outl.appendChild(li(id,[add])); });
  if(!off.length){ const p=document.createElement('div'); p.className='none'; p.textContent='Todas las frases están en este tablero.'; outl.appendChild(p); }
}
$('#open').onclick=()=>{ stop(); renderOrg(); $('#org').hidden=false; };
$('#close').onclick=()=>{ stop(); $('#org').hidden=true; renderMain(); };
$('#new').onclick=()=>{ const n=prompt('Nombre del tablero:'); if(!n||!n.trim()) return; boards.push({nombre:n.trim(), ids:[]}); cur=boards.length-1; save(); renderOrg(); };
$('#ren').onclick=()=>{ const n=prompt('Nuevo nombre:', boards[cur].nombre); if(!n||!n.trim()) return; boards[cur].nombre=n.trim(); save(); renderOrg(); };
$('#del').onclick=()=>{ if(!confirm('¿Borrar el tablero «'+boards[cur].nombre+'»? Las frases siguen en la biblioteca.')) return; boards.splice(cur,1); cur=Math.max(0,cur-1); save(); renderOrg(); };
$('#fsm').onclick=()=>{ fs=Math.max(12,fs-2); store.set('fs2',fs); renderMain(); };
$('#fsp').onclick=()=>{ fs=Math.min(40,fs+2); store.set('fs2',fs); renderMain(); };
renderMain();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');
</script></body></html>
