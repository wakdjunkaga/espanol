<style>
:root{--ink:#1a1a1a;--dim:#6b6b6b;--line:#e2e2e2;--warm:#f5c26b;--red:#c0392b}
*{box-sizing:border-box}
body{margin:0;padding:24px 18px 90px;font-family:-apple-system,BlinkMacSystemFont,
 "PingFang SC","Helvetica Neue",Arial,sans-serif;color:var(--ink);background:#fff;

h1{font-size:19px;font-weight:600;margin:0 0 4px}
.sub{font-size:14px;color:var(--dim);margin:0 0 18px}
.how{font-size:14px;color:#4a4a4a;background:#faf9f7;border-radius:8px;

.item{padding:18px 0;border-top:1px solid var(--line)}
.n{font-size:12px;color:#a9a9a9;margin:0 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

button:disabled{opacity:.35;cursor:default}
button.playing{background:var(--warm);border-color:#d9a63f}

button.rec.on{background:var(--red);border-color:var(--red);color:#fff}
button.ghost{border:none;color:var(--dim);text-decoration:underline;

.state{font-size:13px;color:var(--dim);margin:10px 0 0;min-height:1.2em}
.state.done{color:#14663f}
.zh{display:none;font-size:15px;color:var(--dim);margin:10px 0 0}
.item.glossed .zh{display:block}
.tips{display:none;margin:10px 0 0;padding:10px 14px;background:#f3f6f4;

.item.tipped .tips{display:block}
.tips p{margin:2px 0}
.bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);
 padding:14px 0 10px;margin-top:20px}
.bar button{font-size:16px;padding:12px 22px}
#out{font-size:13px;color:var(--dim);margin:8px 0 0}

<h1>回答练习</h1>
<p class='how'>听问题，然后<strong>用西班牙语回答你自己的真实情况</strong>。不用翻译，想说什么就说什么，一两个词也可以。录完不满意可以重录，多录几遍反而更好。最后按最下面的按钮，把录音打包发给老师。</p>
<div class='item'><p class='n'>1</p>

<button class='gloss-btn ghost'>中文</button>
<button class='tips-btn ghost'>怎么说都行？</button>
</div>

<script>
var QA = window.__qa || [];
var takes = {};                  // index -> Blob of the latest take
var mediaStream = null;

function fmt(n){ return n<10 ? '0'+n : ''+n; }

async function getStream(){
  if(mediaStream) return mediaStream;
  mediaStream = await navigator.mediaDevices.getUserMedia({audio:true});
  return mediaStream;
}

document.querySelectorAll('.item').forEach(function(item, idx){
  var au=item.querySelector('audio.q'), play=item.querySelector('.play');
  var rec=item.querySelector('.rec'), back=item.querySelector('.back');
  var state=item.querySelector('.state'), tips=item.querySelector('.tips-btn');
  var gloss=item.querySelector('.gloss-btn');
  var mr=null, chunks=[], mine=null;

  play.addEventListener('click',function(){
    if(!au.paused){ au.pause(); au.currentTime=0; play.classList.remove('playing'); return; }
    play.classList.add('playing'); au.currentTime=0; au.play();
  });
  au.addEventListener('ended',function(){ play.classList.remove('playing'); });

  rec.addEventListener('click',async function(){
    if(mr && mr.state==='recording'){ mr.stop(); return; }
    try{
      var stream=await getStream();
      chunks=[]; mr=new MediaRecorder(stream);
      mr.ondataavailable=function(e){ if(e.data.size) chunks.push(e.data); };
      mr.onstop=function(){
        var blob=new Blob(chunks,{type:mr.mimeType||'audio/webm'});
        takes[idx]=blob; mine=URL.createObjectURL(blob);
        rec.classList.remove('on'); rec.textContent='● 重录';
        back.disabled=false;
        state.textContent='录好了。可以再录一次，不满意就重来。';
        state.classList.add('done');
        updateBundle();
      };
      mr.start(); rec.classList.add('on'); rec.textContent='■ 停止';
      state.textContent='正在录…… 说完按「停止」。';
      state.classList.remove('done');
    }catch(e){
      state.textContent='打不开麦克风：'+e.message;
    }
  });

  back.addEventListener('click',function(){
    if(!mine) return;
    var a=new Audio(mine); a.play();
  });

  if(tips) tips.addEventListener('click',function(){
    item.classList.add('tipped'); tips.style.display='none';
  });
  if(gloss) gloss.addEventListener('click',function(){
    item.classList.add('glossed'); gloss.style.display='none';
  });
});

function updateBundle(){
  var n=Object.keys(takes).length;
  var b=document.getElementById('bundle');
  b.disabled = n===0;
  document.getElementById('out').textContent =
    n===0 ? '还没有录音。' : ('已经录了 '+n+' 题。');
}

// ---- stitching -----------------------------------------------------------
// Safari records to mp4/aac and Chrome to webm/opus, so the blobs cannot be
// concatenated as bytes. Everything is decoded to raw samples first and then
// re-encoded as one WAV, which every phone can play and send.
function ctx(){
  var C = window.AudioContext || window.webkitAudioContext;
  try { return new C({sampleRate:16000}); } catch(e){ return new C(); }
}

async function decode(ac, arrbuf){
  return new Promise(function(res, rej){
    ac.decodeAudioData(arrbuf, res, rej);
  });
}

function mono(buf){
  if(buf.numberOfChannels===1) return buf.getChannelData(0);
  var a=buf.getChannelData(0), b=buf.getChannelData(1), out=new Float32Array(a.length);
  for(var i=0;i<a.length;i++) out[i]=(a[i]+b[i])/2;
  return out;
}

function wav(samples, rate){
  var buf=new ArrayBuffer(44+samples.length*2), v=new DataView(buf);
  function s(off,str){ for(var i=0;i<str.length;i++) v.setUint8(off+i, str.charCodeAt(i)); }
  s(0,'RIFF'); v.setUint32(4, 36+samples.length*2, true); s(8,'WAVEfmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,rate,true); v.setUint32(28,rate*2,true);
  v.setUint16(32,2,true); v.setUint16(34,16,true);
  s(36,'data'); v.setUint32(40, samples.length*2, true);
  for(var i=0;i<samples.length;i++){
    var x=Math.max(-1,Math.min(1,samples[i]));
    v.setInt16(44+i*2, x<0 ? x*0x8000 : x*0x7FFF, true);
  }
  return new Blob([v], {type:'audio/wav'});
}

document.getElementById('bundle').addEventListener('click', async function(){
  var btn=this, out=document.getElementById('out');
  btn.disabled=true; out.textContent='正在打包……';
  try{
    var ac=ctx(), rate=ac.sampleRate, parts=[];
    var gap=new Float32Array(Math.floor(rate*0.4));
    for(var i=0;i<QA.length;i++){
      var qb=await fetch(QA[i]).then(function(r){return r.arrayBuffer();});
      parts.push(mono(await decode(ac, qb)));
      parts.push(gap);
      if(takes[i]){
        var ab=await takes[i].arrayBuffer();
        parts.push(mono(await decode(ac, ab)));
        parts.push(gap);
      }
    }
    var total=parts.reduce(function(n,p){ return n+p.length; },0);
    var all=new Float32Array(total), at=0;
    parts.forEach(function(p){ all.set(p, at); at+=p.length; });
    var blob=wav(all, rate);
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=(document.title||'answers').replace(/\s+/g,'-')+'.wav';
    a.click();
    out.textContent='好了 —— 把这个文件发给老师就行。'
      +'（'+Math.round(blob.size/1024/1024*10)/10+' MB）';
  }catch(e){
    out.textContent='打包失败：'+e.message+'。可以把手机上的录音直接发给老师。';
  }
  btn.disabled=false;
});
updateBundle();
</script></body></html>
