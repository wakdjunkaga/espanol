<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>课后练习</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf6ef;
    --card: #f5efe4;
    --ink: #2b2620;
    --muted: #8a7f6f;
    --accent: #a8768c;
    --gold: #c9a56a;
    --rule: #e4dccb;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
  }

  body {
    font-family: "EB Garamond", "Noto Serif SC", serif;
    line-height: 1.5;
    padding: 12vh 20px 14vh;
  }

  .sheet {
    max-width: 560px;
    margin: 0 auto;
  }

  .titlepage {
    text-align: center;
    margin-bottom: 46px;
  }

  .kicker {
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 18px;
  }

  .kicker .zh {
    font-family: "Noto Serif SC", serif;
    text-transform: none;
    letter-spacing: 0.1em;
  }

  h1.title {
    font-family: "Cormorant Garamond", "Noto Serif SC", serif;
    font-size: 46px;
    font-weight: 500;
    font-style: italic;
    margin: 0;
    color: var(--ink);
  }

  .subtitle {
    margin-top: 14px;
    font-size: 14px;
    color: var(--muted);
  }

  .subtitle .zh { font-family: "Noto Serif SC", serif; }

  .rule {
    width: 60px;
    height: 1px;
    background: var(--gold);
    margin: 22px auto;
  }

  .day-label {
    font-family: "Noto Serif SC", serif;
    font-size: 12.5px;
    letter-spacing: 0.18em;
    color: var(--accent);
    margin: 34px 2px 10px;
  }

  .day-label:first-of-type { margin-top: 0; }

  .day-label .en {
    font-family: "EB Garamond", serif;
    font-style: italic;
    color: var(--muted);
    letter-spacing: 0.02em;
    margin-left: 8px;
  }

  ul.pages {
    list-style: none;
    margin: 0 0 4px;
    padding: 0;
  }

  li.page { border-top: 1px solid var(--rule); }
  li.page:last-child { border-bottom: 1px solid var(--rule); }

  a.entry {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 6px;
    color: var(--ink);
    text-decoration: none;
    font-size: 19px;
    transition: background 0.15s ease, padding-left 0.15s ease;
  }

  a.entry:hover {
    background: var(--card);
    padding-left: 14px;
  }

  a.entry .glyph {
    color: var(--gold);
    font-size: 14px;
    opacity: 0;
    transform: translateX(-4px);
    transition: opacity 0.15s ease, transform 0.15s ease;
    flex-shrink: 0;
  }

  a.entry:hover .glyph {
    opacity: 1;
    transform: translateX(0);
  }

  .foot {
    margin-top: 54px;
    padding-top: 20px;
    border-top: 1px solid var(--rule);
    text-align: center;
    font-size: 11.5px;
    color: #a79c8c;
    letter-spacing: 0.05em;
  }

  .foot .zh { font-family: "Noto Serif SC", serif; }

  @media (max-width: 480px) {
    h1.title { font-size: 38px; }
    a.entry { font-size: 17px; }
  }
</style>
</head>
<body>
<div class="sheet">

  <div class="titlepage">
    <div class="kicker">Spanish A1 <span class="zh">· 课后练习</span></div>
    <h1 class="title">课后练习</h1>
    <div class="subtitle">点一个开始 <span class="zh">· pick one to start</span></div>
    <div class="rule"></div>
  </div>

  <div class="day-label">8月16日<span class="en">Aug 16</span></div>
  <ul class="pages">
    <li class="page"><a class="entry" href="block5-answers.html"><span>回答练习</span><span class="glyph">→</span></a></li>
  </ul>

  <div class="day-label">8月10日<span class="en">Aug 10</span></div>
  <ul class="pages">
    <li class="page"><a class="entry" href="block4-dictation.html"><span>听写练习</span><span class="glyph">→</span></a></li>
  </ul>

  <div class="day-label">8月7日<span class="en">Aug 7</span></div>
  <ul class="pages">
    <li class="page"><a class="entry" href="block3.html"><span>连读练习</span><span class="glyph">→</span></a></li>
    <li class="page"><a class="entry" href="esta-noche.html"><span>Esta Noche — letra y traducción</span><span class="glyph">→</span></a></li>
  </ul>

  <div class="foot">西语 A1 课程 <span class="zh">· archivo de repaso</span></div>

</div>
</body>
</html>
